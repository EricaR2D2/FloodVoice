{% extends "base.html" %}

{% block content %}
<div class="error-container text-center content-padding section-spacing">
    <div class="error-icon section-spacing">
        {% if error_code == 404 %}
        <i class="fas fa-map-marked-alt fa-5x text-muted"></i>
        {% else %}
        <i class="fas fa-exclamation-triangle fa-5x text-warning"></i>
        {% endif %}
    </div>

    <h1 class="display-4 mb-3">{{ error_code }}</h1>
    <h2 class="h4 mb-4 text-muted">{{ error_message }}</h2>

    <p class="lead mb-4 text-muted">
        The NYC Public Health Dashboard encountered an issue.
    </p>

    <div class="section-spacing">
        <a href="{{ url_for('index') }}" class="btn btn-primary btn-lg">
            <i class="fas fa-home me-2"></i> Return to Dashboard
        </a>
    </div>
</div>
{% endblock %}
