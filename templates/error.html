{% extends "base.html" %}

{% block content %}
<div class="error-container text-center my-5">
    <div class="error-icon mb-4">
        {% if error_code == 404 %}
        <i class="fas fa-map-marked-alt fa-5x text-muted"></i>
        {% else %}
        <i class="fas fa-exclamation-triangle fa-5x text-warning"></i>
        {% endif %}
    </div>
    
    <h1 class="display-4">{{ error_code }}</h1>
    <h2 class="mb-4">{{ error_message }}</h2>
    
    <p class="lead mb-4">
        The NYC Public Health Dashboard encountered an issue.
    </p>
    
    <div class="mt-5">
        <a href="{{ url_for('index') }}" class="btn btn-primary btn-lg">
            <i class="fas fa-home mr-2"></i> Return to Dashboard
        </a>
    </div>
</div>
{% endblock %}
